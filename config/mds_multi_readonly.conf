# One query service, independent per-disk databases, shared in-memory indexes.
# Use a completed v6 shared store and its original matching control directory.
# Stop each importer/single-db service before starting this service.
# Raise the process file limit for large databases, e.g. ulimit -n 262144.
NAMESPACE_BACKEND=lhm_multi_readonly
LHM_DATABASES_FILE=config/lhm_databases.example.tsv
# Query: mds_query --server=127.0.0.1:9000 --database_id=disk-a --path=/Template-000001/path
# Status: mds_query --server=127.0.0.1:9000 --list_databases
# Returned inode numbers are local to database_id. Offline disks require a
# service restart after repair/remount; they do not prevent other disk queries.
