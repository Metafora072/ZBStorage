syntax = "proto3";

package zb.rpc;

import "mds.proto";

option cc_generic_services = true;

// MDS 下发给光盘库节点的单个归档文件信息。
// 只包含从 real_node 下载文件数据所需的最小字段集，目录结构等权威元数据仍留在 MDS。
message ArchiveFile {
  uint64 inode_id = 1;
  uint64 size = 2;
  uint64 object_unit_size = 3;
  string target_node_id = 4;
  string target_disk_id = 5;
  // Required for the in-process modeled archive protocol. Legacy physical
  // optical nodes continue to ignore these additive fields.
  string operation_id = 6;
  string source_lease_id = 7;
  string source_node_id = 8;
  string source_disk_id = 9;
  uint64 source_version = 10;
  string disc_id = 11;
  string image_id = 12;
}

message SendArchiveMetadataRequest {
  uint64 batch_id = 1;
  repeated ArchiveFile files = 2;
  bool end_of_batch = 3; // single-job physical protocol: flush after all preceding files
}

message ArchiveReply {
  MdsStatus status = 1;
  // 批次按文件幂等受理，不保证跨文件原子性。失败时已受理项继续执行；
  // 使用相同操作 ID 重试整个批次不会重复预留容量。
  repeated ArchiveFileAdmission admissions = 2;
}

message ArchiveFileAdmission {
  string operation_id = 1;
  uint64 inode_id = 2;
  MdsStatus status = 3;
}

// —— 光盘读接口（客户端与真实光盘库节点的文件读取）——
// 光盘读取接口采用独立定义的状态类型，不复用 MDS 状态类型。
enum OpticalStatusCode {
  OPTICAL_OK = 0;                  // 本次 RPC 成功，具体完成内容由接口语义确定
  OPTICAL_INVALID_ARGUMENT = 1;    // 参数不符合接口约定
  OPTICAL_NOT_FOUND = 2;           // 引用的文件 / 会话 / 任务不存在
  OPTICAL_NOT_READY = 3;           // 文件准备尚未完成，不能建立读取会话
  OPTICAL_INTERNAL_ERROR = 4;      // 光盘库内部处理失败
  OPTICAL_STALE_GENERATION = 5;    // 节点身份或实例代际不匹配，须重新查询 CMS
  OPTICAL_CONFLICT = 6;            // 分页期间清单改变，丢弃已累积页后重新查询
}

message OpticalStatus {
  OpticalStatusCode code = 1;
  string message = 2;
}
message OpticalLibraryHandoffReply {
  OpticalStatus status = 1;
  OpticalLibraryHandoffRecord record = 2;
  bytes data = 3;
  uint64 received_bytes = 4; // QUERY(path) 的持久连续前缀；完整但哈希错误返回 0，允许重传
}

// MDS 使用的只读归档清单接口。只报告本地已完成介质记录，不触发归档、
// 刻录、MDS 提交或源清理；也不以本地完成代替权威位置/版本校验。
message ArchiveImageInfo {
  string disk_id = 1;
  string image_id = 2;
  uint64 image_offset = 3;         // 真实后端：镜像在盘文件内的偏移，字节
  uint64 image_length = 4;         // 真实镜像长度或模型编码占用，字节
  string sha256 = 5;              // 已有索引记录值；查询不重新计算/验证业务载荷
}

message ListArchiveImagesRequest {
  string node_id = 1;             // CMS 给出的实际目标节点，不能只用服务地址
  uint64 instance_generation = 2; // 必须非零，防止查询替换后的其他实例
  uint32 offset = 3;
  uint32 limit = 4;               // 0 使用 128，最大 1024
  string snapshot_token = 5;      // 第一页为空，后续传上一页值；变化返回 CONFLICT
}

message ListArchiveImagesReply {
  OpticalStatus status = 1;
  string node_id = 2;
  uint64 instance_generation = 3;
  bool modeled = 4;               // true 是逻辑介质，不能用于删除真实源副本
  string snapshot_token = 5;
  repeated ArchiveImageInfo images = 6;
  bool has_more = 7;
  uint32 next_offset = 8;
}

message ArchiveImageFile {
  uint64 inode_id = 1;
  uint64 size = 2;                // 文件逻辑大小，字节
  bool has_file_version = 3;      // 真实卷格式没有版本时必须为 false，不猜测版本
  uint64 file_version = 4;
  string payload_sha256 = 5; // 显式请求时，流式读取/解压实际载荷得到；不是索引摘要
}

message GetArchiveImageFilesRequest {
  string node_id = 1;
  uint64 instance_generation = 2;
  string image_id = 3;
  uint32 offset = 4;
  uint32 limit = 5;               // 0 使用 128，最大 1024
  string snapshot_token = 6;      // 同一镜像的文件清单令牌，分页变化时重新查询
  string disk_id = 7;             // 与 image_id 联合定位，避免盘内编号被误当全局编号
  uint64 digest_inode_id = 8;     // 0 不读载荷；非零仅为该文件计算摘要（用于真实交接核验）
}

message GetArchiveImageFilesReply {
  OpticalStatus status = 1;
  string node_id = 2;
  uint64 instance_generation = 3;
  bool modeled = 4;
  string snapshot_token = 5;
  ArchiveImageInfo image = 6;
  repeated ArchiveImageFile files = 7;
  bool has_more = 8;
  uint32 next_offset = 9;
}

// 任务观察与介质完成分离：真实引擎 WRITE/FINISH 只是压缩阶段结束，
// 不表示整文件刻录或 MDS 提交；完成事实仍由介质清单与权威事务核对。
message ArchiveTaskInfo {
  string task_id = 1;
  string operation_id = 2;         // 模型归档幂等标识；真实旧任务未记录时为空
  uint64 inode_id = 3;            // 盘级任务没有单个 inode，返回 0
  string phase = 4;
  bool terminal = 5;              // 此任务终态，不等于文件归档完成
  bool failed = 6;
  string error = 7;
  string disk_id = 8;
  repeated string image_ids = 9;
  uint64 state_changed_at_ms = 10;
  bool has_file_version = 11;
  uint64 file_version = 12;
  uint64 size = 13;
  bool local_media_complete = 14;  // 仅模型明确有持久逻辑文件时为 true
}
message ListArchiveTasksRequest {
  string node_id = 1;
  uint64 instance_generation = 2;
  uint32 offset = 3;
  uint32 limit = 4;
  string snapshot_token = 5;
}
message ListArchiveTasksReply {
  OpticalStatus status = 1;
  string node_id = 2;
  uint64 instance_generation = 3;
  bool modeled = 4;
  string snapshot_token = 5;
  repeated ArchiveTaskInfo tasks = 6;
  bool has_more = 7;
  uint32 next_offset = 8;
}

// 客户端建立准备完成通知通道：RPC 上附带一个 brpc Stream（传输层对象，非 proto 字段），
// 服务端接受 Stream 后返回 session_id；后续 PrepareRead 用它指定通知接收通道。
message SubscribeReadEventsRequest {
  string client_id = 1;  // 标识本次建立通知连接的 FUSE 客户端实例
}

message SubscribeReadEventsReply {
  OpticalStatus status = 1;
  uint64 session_id = 2;  // 后续 PrepareRead 用它指定通知接收通道
}

// 客户端提交整文件异步准备任务：光盘库登记任务并入队后立即返回，不等待取盘/解压。
// 成功只表示受理（ACCEPTED），不代表文件可读；可读由后续 ReadReady 通知。
message PrepareReadRequest {
  uint64 session_id = 1;   // 已建立的通知会话，决定完成后向哪个 Stream 发送事件
  string request_id = 2;   // 客户端准备请求编号，用于关联响应、完成通知和本地回调
  uint64 inode_id = 3;
  string disk_id = 4;
  string image_id = 5;
  uint64 file_size = 6;    // 已有元数据给出的逻辑文件大小，用于核对准备结果
  // proto3 3.12 无 optional：用显式标志位保留 file_version「未提供」的含义，
  // 不以缺省值擅自推断版本。
  bool   has_file_version = 7;
  uint64 file_version = 8;
}

message PrepareReadReply {
  OpticalStatus status = 1;  // OPTICAL_OK 表示任务已登记并入队，不表示可读
  string request_id = 2;     // 原样返回，关联客户端已有记录
  uint64 task_id = 3;        // 光盘库创建的准备任务编号
}

// 光盘库主动推送给客户端的准备完成事件（序列化后写入通知 Stream，不是 RPC）。
// 消息本身表示成功就绪，不携带 status；通道已确定节点与会话，不重复携带 session_id。
message ReadReadyEvent {
  string request_id = 1;   // 找到客户端在提交前登记的准备请求
  uint64 task_id = 2;      // 后续读会话接口使用的任务编号
  uint64 inode_id = 3;     // 核对通知对应的文件身份
  uint64 file_size = 4;    // 完整产物的实际逻辑大小
  // proto3 3.12 无 optional：用显式标志位保留 file_version「未提供」的含义。
  bool   has_file_version = 5;
  uint64 file_version = 6;
}

// 客户端为一次独立打开建立读取会话：文件已 READY 且准备引用仍存在时调用。
// 不触发新的准备工作，也不等待尚未完成的任务；每次调用返回独立的 read_handle。
message AcquireReadSessionRequest {
  uint64 task_id = 1;  // 当前文件对应的 READY 准备任务
}

message AcquireReadSessionReply {
  OpticalStatus status = 1;
  uint64 read_handle = 2;     // 本次独立打开专属的读取会话
  uint64 file_size = 3;       // 当前准备文件的完整大小
  uint32 max_read_bytes = 4;  // 本会话允许的单次读取上限，必须 > 0，会话期间固定
}

// 在已建立的读会话上同步读取文件区间；offset 为目标文件内绝对偏移，size ≤ max_read_bytes。
// eof 只表示本次请求到达文件末尾，不代表关闭会话或释放缓存。
message ReadPreparedFileRequest {
  uint64 read_handle = 1;
  uint64 offset = 2;
  uint64 size = 3;
}

message ReadPreparedFileReply {
  OpticalStatus status = 1;
  bytes data = 2;          // 该文件区间的真实字节内容
  uint64 bytes_read = 3;   // 实际返回长度，必须等于 data 的长度
  bool eof = 4;            // 本次请求到达文件末尾
}

// 关闭一次读取会话：对应一次独立打开的最终关闭。
// 只减少读取引用，不释放准备引用；close 后仍可对同一 READY 任务再次建立读会话。
message ReleaseReadSessionRequest {
  uint64 read_handle = 1;  // 要结束的读取会话
}

message ReleaseReadSessionReply {
  OpticalStatus status = 1;  // OPTICAL_OK 表示该会话已关闭、读取引用已释放
}

// 结束本轮准备结果的使用：撤销准备引用，之后不再为该任务创建新读会话。
// 现有已打开的读会话继续可读；准备引用与读取引用都归零后清理本次准备的临时产物。
message ReleasePreparedReadRequest {
  uint64 task_id = 1;  // 本轮准备任务
}

message ReleasePreparedReadReply {
  OpticalStatus status = 1;  // OPTICAL_OK 表示准备引用已释放，不再为该任务创建新读会话
}

// ----------------------------------------------------------------------------
// 兼容旧调用方的读接口（deprecated）。
// 新链路统一使用上面的 6 个读接口（SubscribeReadEvents / PrepareRead / AcquireReadSession /
// ReadPreparedFile / ReleaseReadSession / ReleasePreparedRead）。以下 3 个 RPC 及其消息
// 仅为既有调用方（如 FUSE 客户端、scheduler 进程内模拟光盘服务）保留，待其迁移完成后删除。
// ----------------------------------------------------------------------------

// 客户端向光盘库节点提交异步读任务：立即返回 task_id，随后用 ReadObjectByTaskId 取分片。
// disk_id 形如 "optical-disk-<seq>"、image_id 形如 "img-<seq>"，节点在服务层取出尾部 <seq>
// 换算成本地 disk_id / volume_id。
message RequestAsyncReadFileRequest {
  string disk_id = 1;
  string image_id = 2;
  uint64 inode_id = 3;
}

message RequestAsyncReadFileReply {
  MdsStatus status = 1;   // MDS_OK 表示任务已受理，task_id 有效
  uint64 task_id = 2;
}

// 按 task_id 读取 [offset, offset+read_size) 区间；末片读成功后服务端释放读产物。
message ReadObjectByTaskIdRequest {
  uint64 task_id = 1;
  uint64 offset = 2;
  uint64 read_size = 3;
}

message ReadObjectByTaskIdReply {
  MdsStatus status = 1;
  bytes data = 2;
}

// 按 inode_id 读取最近一次 RequestAsyncReadFile(inode_id) 产物的区间。
message ReadObjectByInodeIdRequest {
  uint64 inode_id = 1;
  uint64 offset = 2;
  uint64 read_size = 3;
}

message ReadObjectByInodeIdReply {
  MdsStatus status = 1;
  bytes data = 2;
}

// 光盘库节点对外提供的服务：归档入口（MDS 下发文件信息）+ 数据面读 + 读取通知订阅。
service OpticalNodeService {
  // Scheduler 管理交接；真实节点执行，仿真节点不接受真实介质导入。
  rpc ManageLibraryHandoff(OpticalLibraryHandoffRequest) returns (OpticalLibraryHandoffReply);
  rpc ListArchiveTasks(ListArchiveTasksRequest) returns (ListArchiveTasksReply);
  // MDS 拉取已完成的盘片/镜像清单，并从其卷元数据查询文件映射。
  // 重启后从现有持久索引重建；受理归档成功不保证立即出现在清单中。
  rpc ListArchiveImages(ListArchiveImagesRequest) returns (ListArchiveImagesReply);
  rpc GetArchiveImageFiles(GetArchiveImageFilesRequest) returns (GetArchiveImageFilesReply);
  rpc SendArchiveMetadata(SendArchiveMetadataRequest) returns (ArchiveReply);

  rpc SubscribeReadEvents(SubscribeReadEventsRequest)
      returns (SubscribeReadEventsReply);

  rpc PrepareRead(PrepareReadRequest) returns (PrepareReadReply);

  rpc AcquireReadSession(AcquireReadSessionRequest) returns (AcquireReadSessionReply);

  rpc ReadPreparedFile(ReadPreparedFileRequest) returns (ReadPreparedFileReply);

  rpc ReleaseReadSession(ReleaseReadSessionRequest) returns (ReleaseReadSessionReply);

  rpc ReleasePreparedRead(ReleasePreparedReadRequest) returns (ReleasePreparedReadReply);

  // Deprecated：仅为旧调用方保留，新链路请使用上面的 6 个读接口。
  rpc RequestAsyncReadFile(RequestAsyncReadFileRequest)
      returns (RequestAsyncReadFileReply);

  rpc ReadObjectByTaskId(ReadObjectByTaskIdRequest)
      returns (ReadObjectByTaskIdReply);

  rpc ReadObjectByInodeId(ReadObjectByInodeIdRequest)
      returns (ReadObjectByInodeIdReply);
}
