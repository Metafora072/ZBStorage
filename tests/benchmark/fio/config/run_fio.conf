# 预先准备的 1000 个测试文件相对 FUSE 挂载点的目录。
DATA_DIR=virtual/fio_first16k/dataset

# 每个文件从偏移 0 开始读取的块大小，16384 字节等于 16 KB。
BLOCK_SIZE=16384

FIO_OPTIONS=(
  # FIO 任务名称。
  --name=first16k

  # 使用 POSIX 同步 I/O。
  --ioengine=psync

  # 使用直接 I/O，减少页缓存对测试的影响。
  --direct=1

  # 只执行读操作。
  --rw=read

  # FIO 普通文本格式输出结果。
  --output-format=normal

  # 每次读取的数据大小。
  --bs="${BLOCK_SIZE}"

  # 按脚本生成的 iolog 回放读操作。
  --read_iolog="${IOLOG}"

  # 将普通文本测试结果写入本次运行的日志目录。
  --output="${OUTPUT}"
)
