# 文件集使用当前工作目录下的独立子目录。
set $dir=zb_data

# 文件集包含的文件数。
set $nfiles=100

# 每个文件的大小。
set $filesize=16k

# FileBench 生成层级目录时，每个目录平均包含的文件或子目录数量。
set $dirwidth=10

# 并发工作线程数。
set $nthreads=1

# 单次读写的数据大小。
set $iosize=16k

# 定义名为 zb_files 的文件集。
# path 指定文件集根目录；size 指定单个文件大小；entries 指定文件总数；
# dirwidth 控制目录树的平均宽度；prealloc=80 表示在计时开始前创建并填充 80% 的文件。
define fileset name=zb_files,path=$dir,size=$filesize,entries=$nfiles,dirwidth=$dirwidth,prealloc=80

# 定义 FileBench 工作进程，并且启动 instances 个进程实例。
# 每个线程按书写顺序执行 flowop，执行到末尾后再从第一个 flowop 开始下一轮。
# openfile 和 deletefile 会各自从文件集中选择可用文件，不保证选择同一个文件。
define process name=zb_filebench,instances=1
{
  # 在进程中启动 nthreads 个工作线程。
  # memsize=10m 表示每个线程申请 10 MiB 工作内存，读写操作使用它暂存数据。
  # 该参数不表示文件大小、I/O 大小或 ZBStorage 缓存大小。
  thread name=zb_worker,memsize=10m,instances=$nthreads
  {
    # 从文件集中选择一个尚未创建的文件，创建并通过文件描述符 1 保持打开。
    flowop createfile name=createfile1,filesetname=zb_files,fd=1

    # 通过文件描述符 1 写完整个文件，每次写入 iosize 大小的数据。
    flowop writewholefile name=writefile1,fd=1,srcfd=1,iosize=$iosize

    # 关闭完成写入的文件。
    flowop closefile name=closefile1,fd=1

    # 从文件集中选择一个已有文件，以文件描述符 1 打开。
    flowop openfile name=openfile1,filesetname=zb_files,fd=1

    # 通过文件描述符 1 读取完整个文件，每次读取 iosize 大小的数据。
    flowop readwholefile name=readfile1,fd=1,iosize=$iosize

    # 关闭完成读取的文件。
    flowop closefile name=closefile2,fd=1

    # 从文件集中选择一个已有文件并删除。
    flowop deletefile name=deletefile1,filesetname=zb_files
  }
}

# 正式负载运行时间。
run 30
